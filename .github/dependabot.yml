# Weekly dependency updates. Minor and patch updates are grouped into one pull
# request per ecosystem so routine bumps don't bury the ones worth reading;
# major updates still come one at a time. Security updates are separate from
# this file and follow the repository's Dependabot security settings.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The workflow's actions are pinned by commit SHA; Dependabot bumps the SHA
  # and the version comment beside it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]

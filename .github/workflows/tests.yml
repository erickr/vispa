name: Tests & deploy

# The platform's test suite, run on every push to main and every pull request.
# A push to main that passes the suite is then deployed by the `deploy` job, so
# a red commit never reaches production. Running this workflow by hand also
# runs the suite first; there is no way to deploy without it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP 8.5 / MySQL 8.4

    # Matches the Sail setup: the suite runs against MySQL, not SQLite.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Real environment variables win over .env, so these override the Docker
    # hostnames that only resolve inside Sail.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The public pages load their CSS through @vite, so the build manifest
      # has to exist before any test renders one.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Execute tests
        run: php artisan test

  deploy:
    runs-on: ubuntu-latest
    # Only after the suite is green, and never for a pull request.
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    # Needed to force-push the built assets to the `deploy` branch.
    permissions:
      contents: write

    # Two deploys never run at once; a newer one waits for the running one
    # instead of cancelling it halfway through the server-side steps.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `git push -f` out of a shallow clone is rejected.
          fetch-depth: 0

      # Matches the tests job so the deployed build runs on the version the
      # suite was green against.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, intl
          coverage: none

      # Also runs filament:upgrade via post-autoload-dump, which publishes
      # Filament's assets into public/.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Vite 8 requires Node 20+.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # public/build and the published Filament assets are gitignored
      # for local work, so they need -f to make it onto the deploy branch. The
      # server pulls this branch and never builds assets itself.
      - name: Commit built assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -B deploy
          git add -f public/
          git commit -m "Preparing release (frontend assets built): $(date)"
          git push -f origin deploy

      - name: Setup SSH Keys and known_hosts
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          mkdir -p ~/.ssh/
          ssh-keyscan server10.serverdrift.com >> ~/.ssh/known_hosts
          ssh itomat@server10.serverdrift.com -C whoami
          scp deploy/server_deploy.sh itomat@server10.serverdrift.com:vispa.itomat.se/
          ssh itomat@server10.serverdrift.com -C "chmod +x vispa.itomat.se/server_deploy.sh"
          ssh itomat@server10.serverdrift.com -C "cd vispa.itomat.se/current/ && ../server_deploy.sh"
